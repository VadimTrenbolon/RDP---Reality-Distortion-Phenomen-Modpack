# Configuration file

compatibility {
    # Allow particles to cross biome boundaries [default: false]
    B:crossBiomeBorder=false

    # Enable default vanilla water splash particles [default: false]
    B:doDefaultSplashing=false

    # Limit particle spawn height [default: false]
    B:doSpawnHeightLimit=false

    # Render the default weather effect alongside particles [default: false]
    B:renderDefaultWeather=false

    # Particle spawn height limit (0 = cloud height) [range: 0 ~ 512, default: 0]
    I:spawnHeightLimit=0

    # How much of the water tint to apply vs fog color [range: 0.0 ~ 1.0, default: 0.6]
    S:tintMix=0.6

    # Use heightmap position for temperature checks [default: true]
    B:useHeightmapTemp=true

    # Use Serene Seasons temperature data for rain/snow particle type (requires Serene Seasons) [default: true]
    B:useSereneSeasonsCompat=true

    # Tint rain particles with biome water color [default: true]
    B:waterTint=true
}


general {
    # Whether the mod's effects are enabled [default: true]
    B:enabled=true
}


mist {
    # Mist particle lifetime in ticks [range: 10 ~ 1000, default: 250]
    I:lifetime=250

    # Mist opacity [range: 0.0 ~ 1.0, default: 1.0]
    S:opacity=1.0

    # Mist particle size [range: 0.5 ~ 10.0, default: 3.0]
    S:size=3.0
}


performance {
    # Maximum amount of weather particles at once [range: 100 ~ 10000, default: 1500]
    I:maxParticleAmount=1500

    # Amount of particles spawned per tick [range: 1 ~ 500, default: 100]
    I:particleDensity=100

    # Particle render distance [range: 4 ~ 64, default: 16]
    I:particleDistance=16

    # Amount of particles spawned per tick during storms [range: 1 ~ 500, default: 200]
    I:particleStormDensity=200

    # Range in blocks for surface-level effects like mist and ripples [range: 8 ~ 200, default: 100]
    I:surfaceRange=100
}


ripple {
    # Ripple opacity [range: 0.0 ~ 1.0, default: 0.8]
    S:opacity=0.8

    # Ripple particle size [range: 0.05 ~ 2.0, default: 0.25]
    S:size=0.25
}


shrub {
    # How much shrub particles bounce [range: 0.0 ~ 1.0, default: 0.2]
    S:bounciness=0.2

    # Shrub particle gravity [range: 0.0 ~ 1.0, default: 0.2]
    S:gravity=0.2

    # How much shrub particles rotate [range: 0.0 ~ 2.0, default: 0.6]
    S:rotationAmount=0.6

    # Shrub particle size [range: 0.1 ~ 2.0, default: 0.5]
    S:size=0.5

    # Shrub wind strength during storms [range: 0.0 ~ 1.0, default: 0.3]
    S:stormWindStrength=0.3

    # Shrub wind strength during normal weather [range: 0.0 ~ 1.0, default: 0.2]
    S:windStrength=0.2
}


sound {
    # Rain sound volume (0 = off) [range: 0.0 ~ 1.0, default: 0.2]
    S:rainVolume=0.2

    # Snow sound volume (0 = off) [range: 0.0 ~ 1.0, default: 0.1]
    S:snowVolume=0.1

    # Wind/sandstorm sound volume (0 = off) [range: 0.0 ~ 1.0, default: 0.1]
    S:windVolume=0.1
}


streak {
    # Streak opacity [range: 0.0 ~ 1.0, default: 0.9]
    S:opacity=0.9

    # Streak particle size [range: 0.1 ~ 2.0, default: 0.5]
    S:size=0.5
}


wind {
    # How frequently gusts occur [range: 0.0 ~ 2.0, default: 0.2]
    S:gustFrequency=0.2

    # Speed of wind modulation over time [range: 0.0 ~ 1.0, default: 0.04]
    S:modulationSpeed=0.04

    # Base wind strength [range: 0.0 ~ 2.0, default: 0.4]
    S:strength=0.4

    # Wind strength variance [range: 0.0 ~ 2.0, default: 0.3]
    S:strengthVariance=0.3

    # Reduce wind at low Y levels [default: true]
    B:yLevelAdjustment=true
}


