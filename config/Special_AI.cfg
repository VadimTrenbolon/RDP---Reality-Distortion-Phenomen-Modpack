    #    >> Block_Array:[ Value={ mod_id:block_id, mod_id:block_id[<properties>], mod_id:* }, Default={ minecraft:bed, minecraft:golden_rail, minecraft:crafting_table, minecraft:farmland, minecraft:furnace, minecraft:lit_furnace, minecraft:ladder, minecraft:enchanting_table, minecraft:brewing_stand, industrialrenewal:bunkbed, srparasites:consumed_workbench, srparasites:infested_workbench, srparasites:bruisewood_crafting_table, srparasites:veinwood_crafting_table, srparasites:flesh_crafting_table, srparasites:glow_flesh_crafting_table, srparasites:cooked_flesh_crafting_table, srparasites:fried_flesh_crafting_table, srparasites:liver_crafting_table, srparasites:circle_crafting_table, srparasites:deadhead_crafting_table, srparasites:goth_crafting_table, srparasites:mottled_crafting_table, srparasites:opluntiague_crafting_table, srparasites:infested_ladder, srparasites:consumed_ladder, srparasites:bruisewood_ladder, srparasites:veinwood_ladder, srparasites:flesh_ladder, srparasites:glow_flesh_ladder, srparasites:cooked_flesh_ladder, srparasites:fried_flesh_ladder, srparasites:liver_ladder, srparasites:circle_ladder, srparasites:deadhead_ladder, srparasites:goth_ladder, srparasites:mottled_ladder, srparasites:opluntiague_ladder, techguns:slimyladder, hbm:ladder_sturdy, hbm:ladder_iron, hbm:ladder_gold, hbm:ladder_aluminium, hbm:ladder_copper, hbm:ladder_titanium, hbm:ladder_lead, hbm:ladder_cobalt, hbm:ladder_steel, hbm:ladder_tungsten, hbm:ladder_red, hbm:ladder_red_top } ]
